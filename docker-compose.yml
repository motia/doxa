services:
  syncthing:
    image: syncthing/syncthing:latest
    container_name: obsidian-managed-syncthing
    hostname: ${SYNCTHING_DEVICE_NAME:-vault-vps}
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-002}
    volumes:
      - ${SYNCTHING_CONFIG_PATH:-./data/syncthing}:/var/syncthing
      - ${VAULT_PATH:-./data/vault}:/vault
    ports:
      - 127.0.0.1:${SYNCTHING_GUI_PORT:-8384}:8384
      - ${SYNCTHING_SYNC_PORT:-22000}:22000/tcp
      - ${SYNCTHING_SYNC_PORT:-22000}:22000/udp
      - 21027:21027/udp

  mcp:
    build:
      context: ./mcp
    container_name: obsidian-managed-mcp
    restart: unless-stopped
    environment:
      PORT: 3000
      MCP_TOKEN: ${MCP_TOKEN:?set MCP_TOKEN in .env}
      MCP_ALLOWED_OPS: ${MCP_ALLOWED_OPS:-read,list,search,write,mkdir,move}
      MCP_MAX_FILE_BYTES: ${MCP_MAX_FILE_BYTES:-10485760}
    volumes:
      - ${VAULT_PATH:-./data/vault}/Shared:/data
    ports:
      - 127.0.0.1:${MCP_PORT:-3010}:3000
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
