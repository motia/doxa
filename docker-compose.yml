services:
  syncthing:
    image: syncthing/syncthing:latest
    container_name: doxa-managed-syncthing
    hostname: ${SYNCTHING_DEVICE_NAME:-doxa-vps}
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-002}
    volumes:
      - ${SYNCTHING_CONFIG_PATH:-./data/syncthing}:/var/syncthing
      - ${VAULT_PATH:-./data/vault}:/vault
    ports:
      - 127.0.0.1:${SYNCTHING_GUI_PORT:-8384}:8384
      - ${SYNCTHING_SYNC_PORT:-22000}:22000/tcp
      - ${SYNCTHING_SYNC_PORT:-22000}:22000/udp
      - 21027:21027/udp

  mcp:
    build:
      context: ./mcp
    container_name: doxa-managed-mcp
    restart: unless-stopped
    environment:
      PORT: 3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://doxa-managed.motiavated.com}
      OAUTH_MASTER_KEY_FILE: /run/doxa/oauth-master.key
      OAUTH_SECRETS_FILE: /run/doxa/oauth-secrets.enc
      OAUTH_STATE_FILE: /state/oauth-state.enc
      MCP_ALLOWED_OPS: ${MCP_ALLOWED_OPS:-read,list,search,write,mkdir,move}
      MCP_MAX_FILE_BYTES: ${MCP_MAX_FILE_BYTES:-10485760}
    volumes:
      - ${VAULT_PATH:-./data/vault}/Shared:/data
      - ${OAUTH_MASTER_KEY_PATH:-./data/oauth/oauth-master.key}:/run/doxa/oauth-master.key:ro
      - ${OAUTH_SECRETS_PATH:-./data/oauth/oauth-secrets.enc}:/run/doxa/oauth-secrets.enc:ro
      - ${OAUTH_STATE_DIR:-./data/oauth/state}:/state
    ports:
      - 127.0.0.1:${MCP_PORT:-3010}:3000
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
